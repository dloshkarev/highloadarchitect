version: "3.8"

services:
  pgmaster:
    image: postgres:18-alpine
    container_name: highloadarchitect-pgmaster
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=1024
      - -c
      - ssl=off
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../build/dev/postgres-init:/docker-entrypoint-initdb.d:ro
      - ../build/dev/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - highloadarchitect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3m

  pgslave:
    image: postgres:18-alpine
    container_name: highloadarchitect-pgslave
    entrypoint: ["/usr/local/bin/pg_replica_bootstrap.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
      REPLICATION_PASSWORD: replicator
      REPLICA_NAME: pgslave
    ports:
      - "5434:5432"
    volumes:
      - pgslave-data:/var/lib/postgresql
      - ../build/dev/pg_replica_bootstrap.sh:/usr/local/bin/pg_replica_bootstrap.sh:ro
    networks:
      - highloadarchitect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3m
    depends_on:
      pgmaster:
        condition: service_healthy

  pgasyncslave:
    image: postgres:18-alpine
    container_name: highloadarchitect-pgasyncslave
    entrypoint: ["/usr/local/bin/pg_replica_bootstrap.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
      REPLICATION_PASSWORD: replicator
      REPLICA_NAME: pgasyncslave
    ports:
      - "5435:5432"
    volumes:
      - pgasyncslave-data:/var/lib/postgresql
      - ../build/dev/pg_replica_bootstrap.sh:/usr/local/bin/pg_replica_bootstrap.sh:ro
    networks:
      - highloadarchitect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3m
    depends_on:
      pgmaster:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: build/app.Dockerfile
    image: highloadarchitect:latest
    container_name: highloadarchitect
    restart: on-failure
    environment:
      CONFIG_PATH: /app/config/config.yaml
      POSTGRES_HOST: pgmaster
      POSTGRES_PASSWORD: social
      POSTGRES_READ_HOSTS: "pgslave:5432,pgasyncslave:5432"
    ports:
      - "8080:8080"
    networks:
      - highloadarchitect-network
    depends_on:
      pgmaster:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: highloadarchitect-prometheus
    restart: unless-stopped
    volumes:
      - ../deployments/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - highloadarchitect-network
    depends_on:
      - cadvisor
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: highloadarchitect-node-exporter
    restart: unless-stopped
    expose:
      - "9100"
    networks:
      - highloadarchitect-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: highloadarchitect-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    networks:
      - highloadarchitect-network

  grafana:
    image: grafana/grafana:13.3.0
    container_name: highloadarchitect-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - highloadarchitect-network
    depends_on:
      - prometheus

networks:
  highloadarchitect-network:
    driver: bridge

volumes:
  postgres-data:
  pgslave-data:
  pgasyncslave-data:
  grafana-data:
