version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    container_name: highloadarchitect-postgres
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - highloadarchitect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: build/app.Dockerfile
    image: highloadarchitect:latest
    container_name: highloadarchitect
    environment:
      CONFIG_PATH: /app/config/config.yaml
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: social
    ports:
      - "8080:8080"
    networks:
      - highloadarchitect-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  highloadarchitect-network:
    driver: bridge

volumes:
  postgres-data:
