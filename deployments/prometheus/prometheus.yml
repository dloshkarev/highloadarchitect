global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: patroni
    static_configs:
      - targets: ["patroni1:8008", "patroni2:8008", "patroni3:8008"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter1:9187"]
        labels:
          pg_node: patroni1
      - targets: ["postgres-exporter2:9187"]
        labels:
          pg_node: patroni2
      - targets: ["postgres-exporter3:9187"]
        labels:
          pg_node: patroni3
