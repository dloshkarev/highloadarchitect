# HAProxy перед Patroni-кластером.
# pg_write (5000) ведёт на лидера, pg_read (5001) — round-robin по репликам.
# Роль узла определяется по REST API Patroni (порт 8008): /master и /replica.

global
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /

listen pg_write
    bind *:5000
    option httpchk GET /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

listen pg_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008
